[workspace]
resolver = "2"
members = ["crates/instant-core", "crates/instant-server", "crates/instant-loadtest"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

[workspace.lints.clippy]
# InstantError is intentionally a plain enum mirroring the legacy wire errors;
# boxing it everywhere isn't worth the churn.
result_large_err = "allow"

# Production binary (Dockerfile builds --release): whole-program LTO and a
# single codegen unit buy ~10-20% on the serialize/hash-heavy fan-out paths
# at the cost of a slower release build.
[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
debug = false

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws", "macros"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json", "migrate"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "raw_value"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
md-5 = "0.10"
rand = "0.8"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
jsonwebtoken = "9"
base64 = "0.22"
sha2 = "0.10"
hmac = "0.12"
futures = "0.3"
dashmap = "6"
cel = "0.14"
async-trait = "0.1"
url = "2"
urlencoding = "2"
