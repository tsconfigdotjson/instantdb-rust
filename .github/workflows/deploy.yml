name: Deploy

# Builds the server + dashboard images and rolls the demo VPS to them.
# Runs after CI passes on main, or by hand (Actions → Deploy → Run workflow).
# PRs touching the images or the stack build both images without pushing.
#
# Setup (once): repo variables VPS_HOST, API_DOMAIN; secrets VPS_SSH_KEY
# (private key for the `deploy` user bootstrap.sh created) and
# VPS_KNOWN_HOSTS (`ssh-keyscan <host>` output). See docs/DEPLOY.md.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - LEGACY/client/**
      - deploy/**
      - .github/workflows/deploy.yml

concurrency:
  group: deploy-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write

env:
  IMAGE_REPO: ghcr.io/gratefulworkspace/instantdb-rust
  SHA: ${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha || github.sha }}

jobs:
  build:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        include:
          - image: server
            context: .
            file: Dockerfile
          - image: dashboard
            context: LEGACY/client
            file: LEGACY/client/Dockerfile.www
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE_REPO }}-${{ matrix.image }}:${{ env.SHA }}
            ${{ env.IMAGE_REPO }}-${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: ${{ github.event_name != 'pull_request' && format('type=gha,mode=max,scope={0}', matrix.image) || '' }}

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && vars.VPS_HOST != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
      - name: Configure ssh
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host vps\n  HostName %s\n  User deploy\n  IdentityFile ~/.ssh/id_deploy\n' "${{ vars.VPS_HOST }}" > ~/.ssh/config
      - name: Upload stack files
        run: scp deploy/compose.yml deploy/Caddyfile deploy/postgresql.conf deploy/deploy.sh deploy/backup.sh vps:/opt/instant/
      - name: Roll the stack
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The job token is only valid while this job runs — log in, pull, log out.
          printf '%s' "$TOKEN" | ssh vps "docker login ghcr.io -u ${{ github.actor }} --password-stdin"
          ssh vps "IMAGE_TAG=$SHA /opt/instant/deploy.sh" && rc=0 || rc=$?
          ssh vps "docker logout ghcr.io"
          exit $rc
      - name: Smoke test
        if: vars.API_DOMAIN != ''
        run: curl -fsS --retry 10 --retry-delay 3 --retry-all-errors "https://${{ vars.API_DOMAIN }}/health"
