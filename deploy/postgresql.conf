# Postgres tuned for the single 4 GB demo VPS, shared with instant-server
# (~300 MB), the dashboard (~300 MB) and Caddy. Postgres gets ~2.5 GB of it
# (1 GB buffers + page cache); a 2 GB swapfile (bootstrap.sh) is the backstop.

listen_addresses = '*'
max_connections = 60                 # server pool is 20 (PG_POOL_MAX); rest for migrate/backup/psql

# memory
shared_buffers = 1GB
effective_cache_size = 2560MB
work_mem = 8MB                       # per sort/hash node; 60 conns × a few nodes stays bounded
maintenance_work_mem = 128MB
autovacuum_work_mem = 64MB
huge_pages = off
jit = off                            # OLTP workload; JIT costs memory and latency here
temp_file_limit = 1GB                # one runaway query can't fill the disk

# SSD
random_page_cost = 1.1
effective_io_concurrency = 200

# WAL / checkpoints
wal_compression = zstd
wal_buffers = 16MB
min_wal_size = 256MB
max_wal_size = 1GB
checkpoint_completion_target = 0.9

# parallelism (small box)
max_worker_processes = 4
max_parallel_workers = 2
max_parallel_workers_per_gather = 1
max_parallel_maintenance_workers = 1

# autovacuum: triples churn a lot, keep bloat down on a shared box
autovacuum_naptime = 30s
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02

# safety
idle_in_transaction_session_timeout = 60s

# observability
shared_preload_libraries = 'pg_stat_statements'
log_min_duration_statement = 1000
log_lock_waits = on
log_temp_files = 10MB
log_checkpoints = on
