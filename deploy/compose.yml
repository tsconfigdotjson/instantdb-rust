# Production stack for the public demo: one VPS, one of everything.
# Lives at /opt/instant/compose.yml next to .env; driven by deploy.sh.
#
# Memory budget (4 GB box): postgres 2.5G, server 768M, dashboard 512M,
# caddy 128M, plus a 2 GB swapfile as backstop.

name: instant

x-server-env: &server-env
  DATABASE_URL: postgres://instant:${POSTGRES_PASSWORD}@postgres:5432/instant

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    environment:
      POSTGRES_USER: instant
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: instant
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgresql.conf:/etc/postgresql/postgresql.conf:ro
    shm_size: 256m
    mem_limit: 2560m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U instant"]
      interval: 3s
      timeout: 3s
      retries: 30

  # One-shot: replays migrations, run by deploy.sh before the server starts.
  migrate:
    image: ${IMAGE_REPO}-server:${IMAGE_TAG:-latest}
    profiles: ["migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    environment: *server-env
    entrypoint: ["/bin/bash", "-c", "cd / && MIG_OVERRIDE=/migrations bash /apply-migrations.sh"]

  server:
    image: ${IMAGE_REPO}-server:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *server-env
      PORT: 8888
      BASE_URL: https://${API_DOMAIN}
      INSTANT_DASHBOARD_URL: https://${DASH_DOMAIN}
      PG_POOL_MAX: 20
      INSTANT_SUPERUSER_EMAIL: ${INSTANT_SUPERUSER_EMAIL:-}
      INSTANT_DASHBOARD_SIGNUP_MODE: ${INSTANT_DASHBOARD_SIGNUP_MODE:-restricted}
      INSTANT_DASHBOARD_ALLOWED_EMAILS: ${INSTANT_DASHBOARD_ALLOWED_EMAILS:-}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-log}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      INSTANT_APP_EMAIL_SENDER_EMAIL: ${INSTANT_APP_EMAIL_SENDER_EMAIL:-}
      INSTANT_DASHBOARD_GOOGLE_OAUTH_CLIENT_ID: ${INSTANT_DASHBOARD_GOOGLE_OAUTH_CLIENT_ID:-}
      INSTANT_DASHBOARD_GOOGLE_OAUTH_CLIENT_SECRET: ${INSTANT_DASHBOARD_GOOGLE_OAUTH_CLIENT_SECRET:-}
      # Free-tier demo: everyone gets the paid feature set.
      INSTANT_PAID_FEATURES_FREE: "true"
      # Demo limits: small apps, a few per user, no anonymous apps, and
      # deleted apps purged quickly so their slots and disk come back.
      INSTANT_APP_SIZE_LIMIT_MB: ${INSTANT_APP_SIZE_LIMIT_MB:-10}
      INSTANT_MAX_APPS_PER_USER: ${INSTANT_MAX_APPS_PER_USER:-3}
      INSTANT_EPHEMERAL_APPS: "off"
      INSTANT_HARD_DELETE_GRACE_HOURS: ${INSTANT_HARD_DELETE_GRACE_HOURS:-2}
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8888 && printf \"GET /health HTTP/1.0\\r\\n\\r\\n\" >&3 && grep -q ok <&3'"]
      interval: 10s
      timeout: 3s
      retries: 6
    logging: &logging
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  dashboard:
    image: ${IMAGE_REPO}-dashboard:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      INSTANT_API_URI: https://${API_DOMAIN}
      NODE_OPTIONS: --max-old-space-size=384
    mem_limit: 512m
    logging: *logging

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?set SITE_DOMAIN in .env}
      DASH_DOMAIN: ${DASH_DOMAIN:?set DASH_DOMAIN in .env}
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./site:/srv/site:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [server, dashboard]
    mem_limit: 128m
    logging: *logging

volumes:
  pgdata:
  caddy_data:
  caddy_config:
