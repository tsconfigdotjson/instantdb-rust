[package]
name = "instant-loadtest"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Load-test harness for the sync layer (issue #11): N ws clients x M queries, W writers"

[lints]
workspace = true

[dependencies]
tokio.workspace = true
tokio-tungstenite = "0.24"
futures.workspace = true
serde_json.workspace = true
uuid.workspace = true
reqwest.workspace = true

# Threads, signals and child processes don't exist on the Workers target.
[target.'cfg(not(target_os = "emscripten"))'.dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "process", "signal", "parking_lot"] }
